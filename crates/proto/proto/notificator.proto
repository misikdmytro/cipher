syntax = "proto3";

package notificator;

// Request message for registering a webhook for a secret
message RegisterWebhookRequest {
  // The ID of the secret to register the webhook for
  string secret_id = 1;

  // The URL to call when a rotation event occurs
  string url = 2;
}

// Response message containing the registered webhook ID
message RegisterWebhookResponse {
  // The ID of the created webhook
  string webhook_id = 1;
}

// A single webhook entry returned by list operations
message WebhookEntry {
  string id = 1;
  string secret_id = 2;
  string url = 3;
  string created_at = 4;
}

// Request message for listing webhooks for a secret
message ListWebhooksRequest {
  string secret_id = 1;
  int64 limit = 2;
  int64 offset = 3;
}

// Response message containing the list of webhooks
message ListWebhooksResponse {
  repeated WebhookEntry webhooks = 1;
  int64 total = 2;
}

// Request message for deleting a webhook
message DeleteWebhookRequest {
  string webhook_id = 1;
}

// Response message for webhook deletion
message DeleteWebhookResponse {}

// Service for managing webhook notifications
service NotificatorService {
  // RegisterWebhook registers a new webhook URL for a given secret
  rpc RegisterWebhook(RegisterWebhookRequest) returns (RegisterWebhookResponse);

  // ListWebhooks returns all webhooks registered for a given secret
  rpc ListWebhooks(ListWebhooksRequest) returns (ListWebhooksResponse);

  // DeleteWebhook removes a webhook by its ID
  rpc DeleteWebhook(DeleteWebhookRequest) returns (DeleteWebhookResponse);
}
