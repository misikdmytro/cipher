syntax = "proto3";

package api;

// Request message for retrieving a secret by its ID
message GetSecretRequest {
  // The ID of the secret to retrieve
  string secret_id = 1;
}

// AWS-specific provider configuration
message AwsConfig {
  string role_arn = 1;
}

// Response message containing the secret details
message GetSecretResponse {
  // The ID of the secret
  string secret_id = 1;

  // The logical path of the secret
  string path = 2;

  // Provider-specific configuration
  oneof provider {
    AwsConfig aws = 3;
  }
}

// The API service definition.
service ApiService {
  // GetSecret retrieves a secret by its ID.
  rpc GetSecret(GetSecretRequest) returns (GetSecretResponse);
}
