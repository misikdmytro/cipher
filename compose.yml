services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: cipher
      POSTGRES_PASSWORD: cipher
      POSTGRES_DB: cipher
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  db_data:
